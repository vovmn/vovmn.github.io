services:
  db:
    image: postgres:16
    container_name: immunolab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  init-db:
    image: imulab-init-db:${APP_VERSION:?APP_VERSION is required}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: immunolab_init_db
    restart: "no"
    environment:
      DATABASE_URL: postgres://auth_user:${POSTGRES_PASSWORD}@db:5432/auth_db
      QUESTIONNAIRE_PATH: /usr/src/app/questionnaire.json
    volumes:
      - ./python/questionnaire.json:/usr/src/app/questionnaire.json:ro
    command: ["node", "scripts/init-db.js"]

  backend:
    image: imulab-backend:${APP_VERSION:?APP_VERSION is required}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: immunolab_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgres://auth_user:${POSTGRES_PASSWORD}@db:5432/auth_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://192.168.0.42}
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    image: imulab-frontend:${APP_VERSION:?APP_VERSION is required}
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
    container_name: immunolab_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  pgdata:
